<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JARVIS Mark-VI Mobile AI - Real-Time Always Listening</title>
    
    <!-- Three.js Engine & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Google MediaPipe Hands & Camera Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-blue: #0066ff;
            --neon-magenta: #ff0055;
            --neon-gold: #ffaa00;
            --bg-void: #010408;
            --glass-bg: rgba(4, 14, 28, 0.75);
            --glass-border: rgba(0, 243, 255, 0.3);
            --text-muted: #648ba8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-void);
            color: var(--neon-cyan);
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #webcam-feed {
            display: none;
        }

        .mobile-hud {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 12px) 12px env(safe-area-inset-bottom, 12px) 12px;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .hud-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 6px 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
            transition: border-color 0.3s ease;
        }

        .sys-clock {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .sys-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .pulse-core {
            width: 8px;
            height: 8px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: pulseGlow 1.6s infinite alternate;
        }

        .listening-indicator {
            position: absolute;
            top: env(safe-area-inset-top, 60px);
            left: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--neon-cyan);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 0.65rem;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
        }

        .mic-dot {
            width: 6px;
            height: 6px;
            background: #00ffaa;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ffaa;
            animation: pulseGlow 0.8s infinite alternate;
        }

        .camera-badge {
            position: absolute;
            top: env(safe-area-inset-top, 60px);
            right: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 0.65rem;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: right;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
        }

        .gesture-label {
            color: var(--neon-gold);
            font-weight: 700;
        }

        .bottom-deck {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .chat-display {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 10px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .bubble {
            font-size: 0.8rem;
            line-height: 1.35;
            padding: 6px 10px;
            border-radius: 8px;
        }

        .bubble-jarvis {
            background: rgba(0, 243, 255, 0.1);
            border-left: 3px solid var(--neon-cyan);
            color: #d8f8ff;
        }

        .bubble-user {
            background: rgba(255, 255, 255, 0.12);
            border-right: 3px solid #ffffff;
            color: #ffffff;
            align-self: flex-end;
        }

        .controls-bar {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .mobile-input {
            flex: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 10px 14px;
            color: var(--neon-cyan);
            font-size: 0.8rem;
            outline: none;
            backdrop-filter: blur(12px);
        }

        .mobile-input::placeholder {
            color: var(--text-muted);
        }

        .action-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(0, 243, 255, 0.12);
            border: 1.5px solid var(--neon-cyan);
            color: var(--neon-cyan);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .action-btn:active {
            transform: scale(0.9);
            background: var(--neon-cyan);
            color: var(--bg-void);
        }

        .icon-svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        @keyframes pulseGlow {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(0.8); }
        }

        @media (min-height: 700px) {
            .chat-display { max-height: 180px; }
            .sys-clock { font-size: 1.3rem; }
        }
    </style>
</head>
<body onclick="enableAudioContext()">

    <video id="webcam-feed" playsinline></video>
    <canvas id="webgl-canvas"></canvas>

    <div class="mobile-hud">
        <div class="top-hud">
            <div class="hud-card interactive">
                <div class="sys-clock" id="clock">00:00:00</div>
            </div>
            <div class="hud-card sys-status interactive">
                <div class="pulse-core"></div>
                <span>JARVIS CORE</span>
            </div>
        </div>

        <div class="listening-indicator interactive">
            <div class="mic-dot"></div>
            <span style="color: #00ffaa; font-weight: 700;">ALWAYS LISTENING</span>
        </div>

        <div class="camera-badge interactive">
            <span style="color: var(--text-muted); font-size: 0.55rem;">OPTICAL SENSOR</span>
            <span class="gesture-label" id="gesture-state">STANDBY</span>
        </div>

        <div class="bottom-deck">
            <div class="chat-display interactive" id="chat-box">
                <div class="bubble bubble-jarvis">
                    "Continuous speech listening active, boss. Speak naturally—say 'play [title]' or 'open [website]' anytime."
                </div>
            </div>

            <div class="controls-bar interactive">
                <input type="text" class="mobile-input" id="user-input" placeholder="Voice active... or type command" onkeypress="handleKeyPress(event)">
                <button class="action-btn" onclick="sendChatMessage()" title="Send">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
                <button class="action-btn" onclick="initHandCamera()" title="Enable Camera Hand Gestures">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5-5 5z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ===================================================
           1. THREE.JS 3D CORE ENGINE
           =================================================== */
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4.0;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const pointLight = new THREE.PointLight(0x00f3ff, 2.5, 10);
        scene.add(pointLight);
        scene.add(new THREE.AmbientLight(0x051020));

        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        const wireMat = new THREE.MeshStandardMaterial({
            color: 0x00f3ff,
            wireframe: true,
            emissive: 0x00a3ff,
            emissiveIntensity: 0.6,
            roughness: 0.2,
            metalness: 0.8
        });
        const coreMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.1, 3), wireMat);
        coreGroup.add(coreMesh);

        const innerMat = new THREE.MeshPhongMaterial({
            color: 0x0066ff,
            emissive: 0x002288,
            specular: 0xffffff,
            shininess: 100,
            transparent: true,
            opacity: 0.75
        });
        const innerMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.6, 2), innerMat);
        coreGroup.add(innerMesh);

        const ringMat = new THREE.MeshStandardMaterial({
            color: 0x00f3ff,
            metalness: 0.9,
            roughness: 0.1,
            emissive: 0x0033aa
        });
        const outerRing1 = new THREE.Mesh(new THREE.TorusGeometry(1.55, 0.018, 16, 100), ringMat);
        const outerRing2 = new THREE.Mesh(new THREE.TorusGeometry(1.75, 0.012, 16, 100), ringMat);
        coreGroup.add(outerRing1);
        coreGroup.add(outerRing2);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        let hue = 0;
        let isCustomColor = false;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            coreMesh.rotation.y = elapsed * 0.35;
            coreMesh.rotation.x = elapsed * 0.18;
            innerMesh.rotation.y = -elapsed * 0.6;
            outerRing1.rotation.x = elapsed * 0.4;
            outerRing1.rotation.y = elapsed * 0.3;
            outerRing2.rotation.z = elapsed * 0.5;

            if (!isCustomColor) {
                hue = (hue + 0.0015) % 1;
                wireMat.color.setHSL(hue, 1.0, 0.5);
                wireMat.emissive.setHSL(hue, 1.0, 0.3);
                pointLight.color.setHSL(hue, 1.0, 0.5);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        /* ===================================================
           2. AUDIO & SPEECH SYNTHESIS ENGINE
           =================================================== */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function enableAudioContext() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeep(freq = 880, duration = 0.12) {
            enableAudioContext();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function updateClock() {
            document.getElementById('clock').textContent = new Date().toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 0.95;
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function addChatMessage(sender, text) {
            const chatBox = document.getElementById('chat-box');
            const bubble = document.createElement('div');
            bubble.className = `bubble ${sender === 'JARVIS' ? 'bubble-jarvis' : 'bubble-user'}`;
            bubble.textContent = sender === 'JARVIS' ? `"${text}"` : text;
            chatBox.appendChild(bubble);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /* ===================================================
           3. CONTINUOUS ALWAYS-LISTENING SPEECH RECOGNITION
           =================================================== */
        let continuousRecognition = null;

        function initContinuousSpeech() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                continuousRecognition = new SpeechRec();
                continuousRecognition.continuous = true;
                continuousRecognition.interimResults = false;
                continuousRecognition.lang = 'en-US';

                continuousRecognition.onresult = (event) => {
                    const lastResultIndex = event.results.length - 1;
                    const command = event.results[lastResultIndex][0].transcript.trim();
                    if (command) {
                        processUserIntent(command);
                    }
                };

                // Auto-restart listening if browser drops the audio thread
                continuousRecognition.onend = () => {
                    continuousRecognition.start();
                };

                continuousRecognition.onerror = (err) => {
                    setTimeout(() => { continuousRecognition.start(); }, 1000);
                };

                try {
                    continuousRecognition.start();
                } catch (e) {
                    console.log("Listening already active.");
                }
            } else {
                addChatMessage('JARVIS', 'Speech recognition engine is not supported in this browser version.');
            }
        }

        window.addEventListener('load', () => {
            initContinuousSpeech();
        });

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        function sendChatMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            processUserIntent(text);
        }

        /* ===================================================
           4. REAL-TIME VOICE COMMAND PROCESSOR
           =================================================== */
        function processUserIntent(query) {
            playBeep(1000, 0.1);
            addChatMessage('USER', query);
            const lower = query.toLowerCase();
            let response = "";

            // 1. Play / Search Video Intent
            if (lower.includes('play video') || lower.includes('click video') || lower.includes('play')) {
                let videoTitle = lower.replace('play video', '').replace('click video', '').replace('play', '').trim();
                if (videoTitle) {
                    const targetUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(videoTitle)}`;
                    response = `Opening YouTube video query for: ${videoTitle}.`;
                    window.open(targetUrl, '_blank');
                } else {
                    response = "Please state the video title or topic you want to play.";
                }
            }
            // 2. Open Web Applications
            else if (lower.startsWith('open ')) {
                let site = lower.replace('open ', '').trim();
                let targetUrl = site.startsWith('http') ? site : `https://${site}.com`;
                if (site.includes('youtube')) targetUrl = 'https://www.youtube.com';
                if (site.includes('google')) targetUrl = 'https://www.google.com';
                if (site.includes('github')) targetUrl = 'https://www.github.com';
                response = `Opening ${site}.`;
                window.open(targetUrl, '_blank');
            }
            // 3. Real-Time Math Calculations
            else if (/^[\d\s\+\-\*\/\(\)\.]+$/.test(query)) {
                try {
                    const result = eval(query);
                    response = `The result is ${result}.`;
                } catch {
                    response = "I couldn't process that equation, boss.";
                }
            }
            // 4. Conversational Responses
            else if (lower.includes('who are you') || lower.includes('your name')) {
                response = "I am your JARVIS assistant, configured for real-time continuous listening.";
            } 
            else if (lower.includes('time')) {
                response = `The current time is ${new Date().toLocaleTimeString()}.`;
            } 
            else if (lower.includes('date')) {
                response = `Today is ${new Date().toLocaleDateString()}.`;
            } 
            else {
                response = `Command acknowledged: '${query}'.`;
            }

            addChatMessage('JARVIS', response);
            speak(response);

            // Visual Core Glow Feedback
            isCustomColor = true;
            wireMat.color.setHex(0x00ffaa);
            wireMat.emissive.setHex(0x00ffaa);
            setTimeout(() => { isCustomColor = false; }, 800);
        }

        /* ===================================================
           5. MEDIAPIPE OPTICAL GESTURE ENGINE
           =================================================== */
        function initHandCamera() {
            playBeep(900, 0.2);
            const videoElement = document.getElementById('webcam-feed');
            const stateDisplay = document.getElementById('gesture-state');

            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    const x = (landmarks[9].x - 0.5) * 4.0;
                    const y = -(landmarks[9].y - 0.5) * 4.0;
                    coreGroup.rotation.y = x;
                    coreGroup.rotation.x = y;
                    stateDisplay.textContent = "TRACKING PALM";
                } else {
                    stateDisplay.textContent = "SEARCHING...";
                }
            });

            const cameraDev = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 480,
                height: 360
            });

            cameraDev.start()
                .then(() => {
                    stateDisplay.textContent = "ACTIVE";
                    speak("Camera tracking active.");
                })
                .catch(() => {
                    stateDisplay.textContent = "CAM DENIED";
                });
        }
    </script>
</body>
</html>
