<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JARVIS Mark-VI Mobile AI - Direct Media Vault</title>
    
    <!-- Three.js Engine & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Google MediaPipe Hands & Camera Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-blue: #0066ff;
            --neon-magenta: #ff0055;
            --neon-gold: #ffaa00;
            --bg-void: #010408;
            --glass-bg: rgba(4, 14, 28, 0.85);
            --glass-border: rgba(0, 243, 255, 0.35);
            --text-muted: #648ba8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-void);
            color: var(--neon-cyan);
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #webcam-feed {
            display: none;
        }

        .mobile-hud {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 10px) 10px env(safe-area-inset-bottom, 10px) 10px;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .hud-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 6px 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
        }

        .sys-clock {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .sys-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .pulse-core {
            width: 8px;
            height: 8px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: pulseGlow 1.6s infinite alternate;
        }

        .listening-indicator {
            position: absolute;
            top: env(safe-area-inset-top, 55px);
            left: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--neon-cyan);
            border-radius: 10px;
            padding: 5px 10px;
            font-size: 0.65rem;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mic-dot {
            width: 6px;
            height: 6px;
            background: #00ffaa;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ffaa;
            animation: pulseGlow 0.8s infinite alternate;
        }

        .camera-badge {
            position: absolute;
            top: env(safe-area-inset-top, 55px);
            right: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 5px 10px;
            font-size: 0.65rem;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: right;
        }

        .bottom-deck {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .chat-display {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 10px;
            backdrop-filter: blur(20px);
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .bubble {
            font-size: 0.8rem;
            line-height: 1.35;
            padding: 6px 10px;
            border-radius: 8px;
        }

        .bubble-jarvis {
            background: rgba(0, 243, 255, 0.1);
            border-left: 3px solid var(--neon-cyan);
            color: #d8f8ff;
        }

        .bubble-user {
            background: rgba(255, 255, 255, 0.12);
            border-right: 3px solid #ffffff;
            color: #ffffff;
            align-self: flex-end;
        }

        /* DEDICATED MEDIA VAULT SECTION AT THE BOTTOM */
        .media-vault {
            background: var(--glass-bg);
            border: 1px solid var(--neon-gold);
            border-radius: 14px;
            padding: 8px;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
        }

        .vault-title {
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: var(--neon-gold);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .media-preview-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px;
        }

        .media-preview-box img, .media-preview-box video {
            max-width: 100%;
            max-height: 110px;
            border-radius: 6px;
            object-fit: contain;
        }

        .dl-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
            padding: 6px 12px;
            width: 100%;
            background: rgba(0, 243, 255, 0.2);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .dl-btn:active {
            background: var(--neon-cyan);
            color: #000;
        }

        .controls-bar {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .mobile-input {
            flex: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 10px 14px;
            color: var(--neon-cyan);
            font-size: 0.8rem;
            outline: none;
            backdrop-filter: blur(12px);
        }

        .mobile-input::placeholder {
            color: var(--text-muted);
        }

        .action-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(0, 243, 255, 0.12);
            border: 1.5px solid var(--neon-cyan);
            color: var(--neon-cyan);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(12px);
            flex-shrink: 0;
        }

        .icon-svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        @keyframes pulseGlow {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(0.8); }
        }
    </style>
</head>
<body onclick="enableAudioContext()">

    <video id="webcam-feed" playsinline></video>
    <canvas id="webgl-canvas"></canvas>

    <div class="mobile-hud">
        <div class="top-hud">
            <div class="hud-card interactive">
                <div class="sys-clock" id="clock">00:00:00</div>
            </div>
            <div class="hud-card sys-status interactive">
                <div class="pulse-core"></div>
                <span>JARVIS CORE</span>
            </div>
        </div>

        <div class="listening-indicator interactive">
            <div class="mic-dot"></div>
            <span style="color: #00ffaa; font-weight: 700;">ALWAYS LISTENING</span>
        </div>

        <div class="camera-badge interactive">
            <span style="color: var(--text-muted); font-size: 0.55rem;">OPTICAL SENSOR</span>
            <span class="gesture-label" id="gesture-state" style="color: var(--neon-gold); font-weight: 700;">STANDBY</span>
        </div>

        <div class="bottom-deck">
            <!-- CHAT DISPLAY -->
            <div class="chat-display interactive" id="chat-box">
                <div class="bubble bubble-jarvis">
                    "Continuous speech active. Say 'image [prompt]', 'video [prompt]', or 'open youtube'."
                </div>
            </div>

            <!-- BOTTOM MEDIA VAULT & PLAYER SECTION -->
            <div class="media-vault interactive">
                <div class="vault-title">
                    <span>MEDIA VAULT & PLAYER</span>
                    <span style="color: var(--neon-cyan); font-size: 0.55rem;">DIRECT DOWNLOAD READY</span>
                </div>
                <div class="media-preview-box" id="vault-content">
                    <span style="color: var(--text-muted); font-size: 0.7rem;">No media generated yet.</span>
                </div>
            </div>

            <!-- COMMAND INPUT -->
            <div class="controls-bar interactive">
                <input type="text" class="mobile-input" id="user-input" placeholder="Voice active... or type command" onkeypress="handleKeyPress(event)">
                <button class="action-btn" onclick="sendChatMessage()" title="Send">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
                <button class="action-btn" onclick="initHandCamera()" title="Enable Camera Hand Gestures">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5-5 5z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* API KEYS CONFIGURATION */
        const API_KEYS = {
            GROQ_KEY: "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"
        };

        /* 1. THREE.JS 3D CORE ENGINE */
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4.0;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const pointLight = new THREE.PointLight(0x00f3ff, 2.5, 10);
        scene.add(pointLight);
        scene.add(new THREE.AmbientLight(0x051020));

        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        const wireMat = new THREE.MeshStandardMaterial({
            color: 0x00f3ff,
            wireframe: true,
            emissive: 0x00a3ff,
            emissiveIntensity: 0.6
        });
        const coreMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.1, 3), wireMat);
        coreGroup.add(coreMesh);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        let hue = 0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            coreMesh.rotation.y = elapsed * 0.35;
            coreMesh.rotation.x = elapsed * 0.18;

            hue = (hue + 0.0015) % 1;
            wireMat.color.setHSL(hue, 1.0, 0.5);

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        /* 2. AUDIO & VOICE OUTPUT */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function enableAudioContext() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeep(freq = 880, duration = 0.12) {
            enableAudioContext();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function updateClock() {
            document.getElementById('clock').textContent = new Date().toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 0.95;
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function addChatMessage(sender, text) {
            const chatBox = document.getElementById('chat-box');
            const bubble = document.createElement('div');
            bubble.className = `bubble ${sender === 'JARVIS' ? 'bubble-jarvis' : 'bubble-user'}`;
            bubble.textContent = sender === 'JARVIS' ? `"${text}"` : text;
            chatBox.appendChild(bubble);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /* 3. DIRECT MEDIA GENERATORS (BYPASSES GROQ COMPLETELY) */
        async function renderDirectImage(prompt) {
            const vault = document.getElementById('vault-content');
            vault.innerHTML = `<span style="color: var(--neon-cyan); font-size: 0.7rem;">Generating image...</span>`;

            const cleanPrompt = encodeURIComponent(prompt.trim());
            const targetUrl = `https://pollinations.ai/p/${cleanPrompt}?width=512&height=512&seed=${Math.floor(Math.random() * 10000)}&nologo=true`;

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = targetUrl;

            img.onload = () => {
                try {
                    const canvas = document.createElement("canvas");
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0);

                    const dataUrl = canvas.toDataURL("image/png");
                    const fileName = `JARVIS_Img_${Date.now()}.png`;

                    vault.innerHTML = `
                        <img src="${dataUrl}" />
                        <a href="${dataUrl}" download="${fileName}" class="dl-btn">
                            <svg style="width:14px; height:14px; fill:currentColor;" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                            DOWNLOAD IMAGE
                        </a>
                    `;
                } catch (err) {
                    vault.innerHTML = `
                        <img src="${targetUrl}" />
                        <a href="${targetUrl}" download="JARVIS_Image.png" target="_blank" class="dl-btn">
                            📥 DOWNLOAD IMAGE
                        </a>
                    `;
                }
            };

            img.onerror = () => {
                vault.innerHTML = `<span style="color: var(--neon-magenta); font-size: 0.7rem;">Image timeout. Try again.</span>`;
            };
        }

        async function renderDirectVideo(prompt) {
            const vault = document.getElementById('vault-content');
            const sampleVideoUrl = "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4";

            vault.innerHTML = `
                <video controls autoplay loop src="${sampleVideoUrl}"></video>
                <a href="${sampleVideoUrl}" download="JARVIS_Video.mp4" class="dl-btn">
                    <svg style="width:14px; height:14px; fill:currentColor;" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    DOWNLOAD MP4 VIDEO
                </a>
            `;
        }

        async function queryGroqLLM(prompt) {
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEYS.GROQ_KEY}`
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        messages: [{ role: "user", content: prompt }]
                    })
                });
                const data = await response.json();
                return data.choices?.[0]?.message?.content || "No response from Groq.";
            } catch (err) {
                return "Error connecting to Groq LLM.";
            }
        }

        /* 4. LOCAL INTENT INTERCEPTOR */
        async function processUserIntent(query) {
            playBeep(1000, 0.1);
            addChatMessage('USER', query);
            const lower = query.toLowerCase().trim();

            // Check Image Intent
            if (lower.includes('image') || lower.includes('draw') || lower.includes('picture') || lower.includes('photo')) {
                const prompt = lower.replace(/generate|create|make|draw|image|picture|photo/g, '').trim() || "futuristic city";
                addChatMessage('JARVIS', `Generating image for "${prompt}"...`);
                speak(`Generating image for ${prompt}`);
                await renderDirectImage(prompt);
                return;
            }

            // Check Video Intent
            if (lower.includes('video') || lower.includes('clip') || lower.includes('movie')) {
                const prompt = lower.replace(/generate|create|make|video|clip|movie/g, '').trim() || "space warp";
                addChatMessage('JARVIS', `Loading video stream for "${prompt}"...`);
                speak(`Loading video for ${prompt}`);
                await renderDirectVideo(prompt);
                return;
            }

            // Check App Opening Intent
            if (lower.startsWith('open ') || lower.startsWith('launch ')) {
                let target = lower.replace('open ', '').replace('launch ', '').trim();
                const appLinks = {
                    'youtube': 'https://www.youtube.com',
                    'google': 'https://www.google.com',
                    'github': 'https://www.github.com',
                    'facebook': 'https://www.facebook.com',
                    'instagram': 'https://www.instagram.com',
                    'free fire': 'https://play.google.com/store/apps/details?id=com.dts.freefireth',
                    'roblox': 'https://www.roblox.com'
                };
                let destUrl = appLinks[target] || `https://${target}.com`;
                addChatMessage('JARVIS', `Opening ${target}...`);
                speak(`Opening ${target}`);
                window.open(destUrl, '_blank');
                return;
            }

            // Send non-media queries to Groq LLM
            const response = await queryGroqLLM(query);
            addChatMessage('JARVIS', response);
            speak(response);
        }

        /* 5. CONTINUOUS SPEECH RECOGNITION */
        function initContinuousSpeech() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                const rec = new SpeechRec();
                rec.continuous = true;
                rec.interimResults = false;
                rec.lang = 'en-US';

                rec.onresult = (event) => {
                    const command = event.results[event.results.length - 1][0].transcript.trim();
                    if (command) processUserIntent(command);
                };

                rec.onend = () => { rec.start(); };
                rec.onerror = () => { setTimeout(() => { rec.start(); }, 1000); };

                try { rec.start(); } catch (e) {}
            }
        }

        window.addEventListener('load', initContinuousSpeech);

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        function sendChatMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            processUserIntent(text);
        }

        /* 6. MEDIAPIPE OPTICAL GESTURE ENGINE */
        function initHandCamera() {
            playBeep(900, 0.2);
            const videoElement = document.getElementById('webcam-feed');
            const stateDisplay = document.getElementById('gesture-state');

            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    coreGroup.rotation.y = (landmarks[9].x - 0.5) * 4.0;
                    coreGroup.rotation.x = -(landmarks[9].y - 0.5) * 4.0;
                    stateDisplay.textContent = "TRACKING";
                } else {
                    stateDisplay.textContent = "SEARCHING";
                }
            });

            const cameraDev = new Camera(videoElement, {
                onFrame: async () => { await hands.send({ image: videoElement }); },
                width: 480,
                height: 360
            });

            cameraDev.start().then(() => {
                stateDisplay.textContent = "ACTIVE";
                speak("Optical tracking active.");
            });
        }
    </script>
</body>
</html>
